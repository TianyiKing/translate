<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translator</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <h1>Translator</h1>
    </header>

    <div class="input-group">
      <label for="inputText">English</label>
      <textarea id="inputText" placeholder="Type something to translate..."></textarea>
      <button id="listenBtn" class="icon-btn" aria-label="Listen to English">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>

    <div class="actions">
      <button id="translateBtn">Translate</button>
    </div>

    <div class="output-group">
      <label for="outputText">Chinese (Simplified)</label>
      <div id="outputText" class="output-area" placeholder="Translation will appear here..."></div>
    </div>

    <div class="toggle-group">
      <label class="switch">
        <input type="checkbox" id="selectionToggle">
        <span class="slider round"></span>
      </label>
      <span class="toggle-label">Selection Mode</span>
    </div>

    <div class="toggle-group">
      <label class="switch">
        <input type="checkbox" id="floatingToggle">
        <span class="slider round"></span>
      </label>
      <span class="toggle-label">Show Floating Button</span>
    </div>

    <div class="toggle-group">
      <label class="switch">
        <input type="checkbox" id="shortcutsToggle">
        <span class="slider round"></span>
      </label>
      <span class="toggle-label">Enable Shortcuts (Opt+A/S)</span>
    </div>

    <div class="separator"></div>

    <div class="radio-group">
      <label class="group-label">Translation Source</label>
      <label class="radio-item">
        <input type="radio" name="provider" value="google">
        <span>Google</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="provider" value="baidu">
        <span>Baidu</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="provider" value="local">
        <span>Local Model (mlx-vlm)</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="provider" value="hy_mt2">
        <span>Hy-MT2</span>
      </label>
    </div>

    <div class="radio-group">
      <label class="group-label">TTS Source</label>
      <label class="radio-item">
        <input type="radio" name="ttsProvider" value="google">
        <span>Google</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="ttsProvider" value="baidu">
        <span>Baidu</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="ttsProvider" value="local">
        <span>Local TTS (mlx-audio Kokoro)</span>
      </label>
    </div>

    <div id="baiduSettings" class="settings-group hidden">
      <div id="baiduKeyInputs">
        <div class="input-group">
          <label for="baiduAppId">App ID</label>
          <input type="text" id="baiduAppId" placeholder="Enter App ID">
        </div>
        <div class="input-group">
          <label for="baiduSecret">Secret Key</label>
          <input type="password" id="baiduSecret" placeholder="Enter Secret Key">
        </div>
      </div>
      <button id="saveBaiduKeys" class="secondary-btn">Save Keys</button>
    </div>

    <div id="localModelSettings" class="settings-group hidden">
      <label class="group-label">Local Model Settings</label>
      <div id="localModelInputs">
        <div class="input-group">
          <label for="localModelName">Model Name</label>
          <input type="text" id="localModelName" placeholder="mlx-community/gemma-4-31b-it-mxfp4">
        </div>
        <div class="input-group">
          <label for="localModelPort">Port</label>
          <input type="text" id="localModelPort" placeholder="8099">
        </div>
      </div>
      <button id="saveLocalModel" class="secondary-btn">Save Model Settings</button>
    </div>

    <div id="hyMt2Settings" class="settings-group hidden">
      <label class="group-label">Hy-MT2 Settings</label>
      <div id="hyMt2Inputs">
        <div class="input-group">
          <label for="hyMt2Port">Port</label>
          <input type="number" id="hyMt2Port" min="1" max="65535" step="1" placeholder="8096">
        </div>
        <div class="input-group">
          <label for="hyMt2TimeoutSeconds">Timeout (seconds)</label>
          <input type="number" id="hyMt2TimeoutSeconds" min="1" max="120" step="1" placeholder="32">
        </div>
      </div>
      <button id="saveHyMt2" class="secondary-btn">Save Hy-MT2 Settings</button>
    </div>

    <div id="localTtsSettings" class="settings-group hidden">
      <label class="group-label">Local TTS Settings</label>
      <div id="localTtsInputs">
        <div class="input-group">
          <label for="localTtsUrl">Endpoint URL</label>
          <input type="text" id="localTtsUrl" placeholder="http://127.0.0.1:8098/v1/audio/speech">
        </div>
        <div class="input-group">
          <label>Voice</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="localTtsVoice" value="af_heart">
              <span>af_heart (US Female)</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="localTtsVoice" value="am_michael">
              <span>am_michael (US Male)</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="localTtsVoice" value="bf_emma">
              <span>bf_emma (UK Female)</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="localTtsVoice" value="bm_george">
              <span>bm_george (UK Male)</span>
            </label>
          </div>
        </div>
      </div>
      <button id="saveLocalTts" class="secondary-btn">Save TTS Settings</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>

</html>
